[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olfactra"
version = "0.1.0"
description = "OLFACTRA Core — clean-room, public-data fragrance intelligence (MIT)"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "FEI · HEL Lab, Gyeongsang National University" }]
keywords = ["fragrance", "perfumery", "molecule", "terpene", "scent", "forest-therapy", "open-source"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Other/Nonlisted Topic",
  "Intended Audience :: Science/Research",
]
dependencies = []

[project.optional-dependencies]
export = ["pandas>=2.0", "openpyxl>=3.1"]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
test = ["pytest>=8.0", "httpx>=0.27", "pandas>=2.0", "openpyxl>=3.1", "fastapi>=0.110"]

[project.urls]
Homepage = "https://sunbear5020.github.io/olfactra/"
Source = "https://github.com/sunbear5020/olfactra"
Notice = "https://github.com/sunbear5020/olfactra/blob/main/NOTICE.md"

[project.scripts]
olfactra = "olfactra_core.cli:main"

[tool.setuptools]
packages = ["olfactra_core", "api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
